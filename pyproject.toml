[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citrusina"
version = "0.1.0"
description = "Copy and convert files from a little circle that pops up where you are"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PySide6>=6.7", "pillow", "pillow-heif", "cairosvg"]

[project.scripts]
citrusina = "citrusina.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citrusina = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
